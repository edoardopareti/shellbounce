[project]
name = "shellbounce-ai"
version = "0.1.0"
description = "Python AI bridge for Shellbounce snapshots and TankInput streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"websockets>=12.0,<16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
